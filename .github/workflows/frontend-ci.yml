name: Frontend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Intraview-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./Intraview-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build