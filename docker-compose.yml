services:
  backend:
    build:
      context: ./intraview
    container_name: intraview-backend
    command: daphne -b 0.0.0.0 -p 8000 intraview.asgi:application
    ports:
      - "8000:8000"
    env_file:
      - ./intraview/.env
    volumes:
      - ./intraview:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  celery-worker:
    build:
      context: ./intraview
    container_name: intraview-celery-worker
    command: celery -A intraview worker -l info
    env_file:
      - ./intraview/.env
    volumes:
      - ./intraview:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ./intraview
    container_name: intraview-celery-beat
    command: celery -A intraview beat -l info
    env_file:
      - ./intraview/.env
    volumes:
      - ./intraview:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7
    container_name: intraview-redis
    ports:
      - "6379:6379"