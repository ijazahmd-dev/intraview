services:
  backend:
    build:
      context: ./intraview
    container_name: intraview-backend
    command: daphne -b 0.0.0.0 -p 8000 intraview.asgi:application
    ports:
      - "8000:8000"
    env_file:
      - ./intraview/.env
    volumes:
      - ./intraview:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build:
      context: ./intraview
    container_name: intraview-celery-worker
    command: celery -A intraview worker -l info
    env_file:
      - ./intraview/.env
    volumes:
      - ./intraview:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ./intraview
    container_name: intraview-celery-beat
    command: celery -A intraview beat -l info
    env_file:
      - ./intraview/.env
    volumes:
      - ./intraview:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17
    container_name: intraview-postgres
    restart: always
    env_file:
      - ./intraview/.env
    environment:
      POSTGRES_DB: intraview_database
      POSTGRES_USER: intraview_user
      POSTGRES_PASSWORD: Intraview@1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intraview_user -d intraview_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: intraview-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: