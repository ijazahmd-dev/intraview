
services:
  backend:
    build:
      context: ./intraview
    container_name: intraview-backend
    command: daphne -b 0.0.0.0 -p 8000 intraview.asgi:application
    restart: unless-stopped
    env_file:
      - ./intraview/.env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started

  celery-worker:
    build:
      context: ./intraview
    container_name: intraview-celery-worker
    command: celery -A intraview worker -l info
    restart: unless-stopped
    env_file:
      - ./intraview/.env
    depends_on:
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ./intraview
    container_name: intraview-celery-beat
    command: celery -A intraview beat -l info
    restart: unless-stopped
    env_file:
      - ./intraview/.env
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7
    container_name: intraview-redis
    restart: unless-stopped
    command: redis-server --appendonly yes