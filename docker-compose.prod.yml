
services:
  backend:
    build:
      context: ./intraview
    container_name: intraview-backend
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 intraview.asgi:application
      "
    restart: unless-stopped
    env_file:
      - ./intraview/.env

    volumes:
      - ./staticfiles:/app/staticfiles  
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started

  celery-worker:
    build:
      context: ./intraview
    container_name: intraview-celery-worker
    command: celery -A intraview worker -l info
    restart: unless-stopped
    env_file:
      - ./intraview/.env
    depends_on:
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ./intraview
    container_name: intraview-celery-beat
    command: celery -A intraview beat -l info
    restart: unless-stopped
    env_file:
      - ./intraview/.env
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7
    container_name: intraview-redis
    restart: unless-stopped
    command: redis-server --appendonly yes

  ai-agent:
    build:
      context: ./intraview-agent
    container_name: intraview-agent
    restart: unless-stopped
    env_file:
      - ./intraview-agent/.env
    command: uv run src/agent.py start
    depends_on:
      backend:
        condition: service_started  